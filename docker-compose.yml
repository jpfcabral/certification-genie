services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: certification-genie-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - COSMOS_CONNECTION_STRING=AccountEndpoint=https://localhost:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==;
    volumes:
      - ./src:/app/src

  frontend:
    image: nginx:alpine
    container_name: certification-genie-frontend
    ports:
      - "3000:80"
    volumes:
      - ./src/frontend:/usr/share/nginx/html:ro
      - ./src/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
