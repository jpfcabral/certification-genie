<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certification Genie - Telegram Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1a1a3e;
            padding: 14px 24px;
            border-bottom: 1px solid #2d2d5e;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 { font-size: 1.1rem; color: #a78bfa; }
        header .subtitle { font-size: 0.75rem; color: #8b8baf; margin-left: 8px; }

        header .status {
            margin-left: auto;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            background: #1f4d3a;
            color: #6ee7b7;
        }

        header .status.offline { background: #4d1f1f; color: #fca5a5; }

        .container { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar — command shortcuts only */
        .sidebar {
            width: 220px;
            background: #12122e;
            border-right: 1px solid #2d2d5e;
            padding: 14px;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #8b8baf;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .sidebar button {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 5px;
            background: #1e1e4a;
            border: 1px solid #3d3d7a;
            border-radius: 6px;
            color: #c4b5fd;
            cursor: pointer;
            font-size: 0.82rem;
            text-align: left;
            transition: all 0.15s;
        }

        .sidebar button:hover { background: #2d2d6e; border-color: #a78bfa; }
        .sidebar .section { margin-bottom: 16px; }

        .sidebar .info {
            font-size: 0.7rem;
            color: #6b6b8f;
            line-height: 1.5;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #2d2d5e;
        }

        /* Chat area */
        .chat-area { flex: 1; display: flex; flex-direction: column; }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.88rem;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot { align-self: flex-start; background: #1e1e4a; border: 1px solid #3d3d7a; }
        .message.user { align-self: flex-end; background: #4c1d95; border: 1px solid #6d28d9; }
        .message.system { align-self: center; background: #1f3a2e; border: 1px solid #2d5e4a; font-size: 0.78rem; color: #6ee7b7; }
        .message.error { align-self: center; background: #3a1f1f; border: 1px solid #5e2d2d; font-size: 0.78rem; color: #fca5a5; }

        .message.keyboard { background: transparent; border: none; display: flex; flex-wrap: wrap; gap: 6px; }
        .message.keyboard .kb-btn {
            padding: 8px 14px;
            background: #1e1e4a;
            border: 1px solid #6d28d9;
            border-radius: 6px;
            color: #c4b5fd;
            cursor: pointer;
            font-size: 0.82rem;
            transition: all 0.15s;
        }
        .message.keyboard .kb-btn:hover { background: #4c1d95; color: white; }

        /* Typing indicator */
        .message.typing { align-self: flex-start; background: #1e1e4a; border: 1px solid #3d3d7a; padding: 12px 18px; }
        .message.typing .dot {
            display: inline-block;
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #8b8baf;
            margin-right: 4px;
            animation: bounce 1.2s infinite;
        }
        .message.typing .dot:nth-child(2) { animation-delay: 0.2s; }
        .message.typing .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }

        /* Quiz poll */
        .quiz-poll {
            background: #1e1e4a;
            border: 1px solid #3d3d7a;
            border-radius: 12px;
            padding: 14px;
            max-width: 80%;
            align-self: flex-start;
            animation: fadeIn 0.2s ease;
        }

        .quiz-poll .question-text { font-weight: 600; margin-bottom: 10px; color: #e0e0ff; font-size: 0.9rem; }

        .quiz-poll .options { display: flex; flex-direction: column; gap: 6px; }

        .quiz-poll .option {
            padding: 9px 12px;
            border: 1px solid #4d4d8a;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .quiz-poll .option:hover { background: #2d2d6e; border-color: #a78bfa; }
        .quiz-poll .option.correct { background: #1f4d3a; border-color: #6ee7b7; cursor: default; }
        .quiz-poll .option.incorrect { background: #4d1f1f; border-color: #fca5a5; cursor: default; }
        .quiz-poll .option.disabled { cursor: default; opacity: 0.6; }

        .quiz-poll .option .letter {
            width: 22px; height: 22px;
            border-radius: 50%;
            background: #3d3d7a;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: 700;
        }

        /* Input area */
        .input-area {
            padding: 14px 20px;
            background: #12122e;
            border-top: 1px solid #2d2d5e;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #3d3d7a;
            background: #1e1e4a;
            color: #e0e0e0;
            font-size: 0.88rem;
            outline: none;
        }

        .input-area input:focus { border-color: #a78bfa; }

        .input-area button {
            padding: 10px 18px;
            border-radius: 8px;
            background: #6d28d9;
            border: none;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.15s;
        }

        .input-area button:hover { background: #7c3aed; }
    </style>
</head>
<body>
    <header>
        <span style="font-size: 1.4rem;">🧞‍♂️</span>
        <h1>Certification Genie</h1>
        <span class="subtitle">Telegram Simulator</span>
        <span class="status" id="api-status">Conectando...</span>
    </header>

    <div class="container">
        <div class="sidebar">
            <div class="section">
                <h2>Atalhos de Comando</h2>
                <button onclick="sendCommand('/start')">🏠 /start</button>
                <button onclick="sendCommand('/train')">📚 /train</button>
                <button onclick="sendCommand('/simulate')">📝 /simulate</button>
                <button onclick="sendCommand('/ask')">💬 /ask</button>
                <button onclick="sendCommand('/progress')">📊 /progress</button>
                <button onclick="sendCommand('/flashcard')">🃏 /flashcard</button>
                <button onclick="sendCommand('/domains')">🌐 /domains</button>
                <button onclick="sendCommand('/weak_areas')">📉 /weak_areas</button>
                <button onclick="sendCommand('/exit')">🚪 /exit</button>
            </div>

            <div class="section">
                <button onclick="clearChat()" style="background:#2d1a1a;border-color:#5e2d2d;color:#fca5a5;">🗑️ Limpar chat</button>
            </div>

            <div class="info">
                Thin client — simula o Telegram.<br>
                Toda lógica roda no backend.<br>
                API: <code>:8000</code> | Front: <code>:3000</code>
            </div>
        </div>

        <div class="chat-area">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Digite uma mensagem ou /comando..."
                       onkeypress="if(event.key==='Enter') sendMessage()" autocomplete="off">
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
